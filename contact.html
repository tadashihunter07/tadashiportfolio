<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadashi | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">Tadashi</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
        </ul>

        <button id="theme-toggle" class="theme-btn">🌙</button>
    </nav>
</header>

<main class="contact-page">

    <h1>Contact Me</h1>
    <p>Have a question or collaboration idea? Send me a message!</p>

    <form id="contact-form">

        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" required>
            <p class="error-msg" id="name-error"></p>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" required>
            <p class="error-msg" id="email-error"></p>
        </div>

        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" rows="5" required></textarea>
            <p class="error-msg" id="message-error"></p>
        </div>

        <button type="submit" class="btn primary-btn">Send</button>

        <p class="form-status" id="status"></p>
    </form>

</main>

<footer>
    <p>© 2025 Tadashi — All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
